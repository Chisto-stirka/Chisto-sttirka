<!-- СЕТКА ИЗ 5 КАРТОЧЕК (10 ФОТО) -->
<div class="comparison-grid">

  <!-- КАРТОЧКА 1: Ковёр -->
  <div class="comparison-card">
    <div class="dual-photo-wrapper">
      <!-- ФОТО "ДО" (ЛЕВАЯ ПОЛОВИНА) -->
      <img src="img/kover1posle.jpg.jpg" alt="Ковёр до чистки" class="side-image" loading="lazy">
      
      <!-- ФОТО "ПОСЛЕ" (ПРАВАЯ ПОЛОВИНА) -->
      <img src="img/kover1do.jpg.jpg" alt="Ковёр после чистки" class="side-image" loading="lazy">
      
      <!-- ЛИНИЯ ПОСЕРЕДИНЕ -->
      <div class="divider"></div>
    </div>
    <div class="labels-row">
      <span>До</span>
      <span>После</span>
    </div>
  </div>

  <!-- КАРТОЧКА 2: Плед -->
  <div class="comparison-card">
    <div class="dual-photo-wrapper">
      <img src="img/kover2do.jpg.jpg" alt="Ковёр до чистки" class="side-image" loading="lazy">
      <img src="img/kover2posle.jpg.jpg" alt="Ковёр после чистки" class="side-image" loading="lazy">
    </div>
    <div class="labels-row">
      <span>До</span>
      <span>После</span>
    </div>
  </div>

  <!-- КАРТОЧКА 3: Подушка -->
  <div class="comparison-card">
    <div class="dual-photo-wrapper">
      <img src="img/kover3do.jpg.jpg" alt="Ковёр до чистки" class="side-image" loading="lazy">
      <img src="img/kover3posle.jpg.jpg" alt="Ковёр после чистки" class="side-image" loading="lazy">
      <div class="divider"></div>
    </div>
    <div class="labels-row">
      <span>До</span>
      <span>После</span>
    </div>
  </div>

  <!-- КАРТОЧКА 4: Мягкая игрушка -->
  <div class="comparison-card">
    <div class="dual-photo-wrapper">
      <img src="img/kover4do.jpg.jpg" alt="Ковёр до чистки" class="side-image" loading="lazy">
      <img src="img/kover4posle.jpg.jpg" alt="Ковёр после чистки" class="side-image" loading="lazy">
      <div class="divider"></div>
    </div>
    <div class="labels-row">
      <span>До</span>
      <span>После</span>
    </div>
  </div>

  <!-- КАРТОЧКА 5: Накидка на диван -->
  <div class="comparison-card">
    <div class="dual-photo-wrapper">
      <img src="img/kover5do.jpg.jpg" alt="Ковёр до чистки" class="side-image" loading="lazy">
      <img src="img/kover5posle.jpg.jpg" alt="Ковёр после чистки" class="side-image" loading="lazy">
      <div class="divider"></div>
    </div>
    <div class="labels-row">
      <span>До</span>
      <span>После</span>
    </div>
  </div>

</div>
